name: Apply Raw Hosted Graph Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-raw-host-graph-refactor.yml'
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: raw-hosted-graph-refactor
  cancel-in-progress: true

jobs:
  refactor-and-verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.issue.title == '[internal] Apply raw hosted graph refactor'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE
          fetch-depth: 1

      - name: Apply host architecture refactor
        shell: pwsh
        run: |
          python tools/apply_raw_host_graph_refactor.py *>&1 | Tee-Object -FilePath host-refactor-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/apply_raw_host_compile_fixes.py *>&1 | Tee-Object -FilePath host-refactor-ci.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure GestureRack
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGESTURERACK_FETCH_JUCE=OFF *>&1 | Tee-Object -FilePath host-refactor-ci.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3 and isolated scanner
        shell: pwsh
        run: |
          cmake --build build --config Release --target GestureRack_VST3 --parallel 2 *>&1 | Tee-Object -FilePath host-refactor-ci.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify host architecture invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "Source/GestureBypassWrapper.cpp") { throw "Legacy hosted wrapper still exists" }
          if (Test-Path "Source/GestureBypassWrapper.h") { throw "Legacy hosted wrapper still exists" }
          if (Select-String -Path Source/*.cpp,Source/*.h -Pattern "disableNonMainBuses" -Quiet) { throw "Host still disables non-main buses" }
          if (-not (Select-String -Path Source/RackGraphManager.cpp -Pattern "AudioPluginInstance" -Quiet)) { throw "Raw plugin nodes not installed" }
          if (-not (Select-String -Path Source/PluginProcessor.cpp -Pattern 'Aux 8' -Quiet)) { throw "Rack aux bank missing" }
          if (-not (Test-Path "build/GestureRack_artefacts/Release/VST3/Gesture Rack.vst3")) { throw "VST3 output missing" }
          "Host architecture invariants passed." | Tee-Object -FilePath host-refactor-ci.log -Append

      - name: Report failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail = if (Test-Path host-refactor-ci.log) { (Get-Content host-refactor-ci.log -Tail 160) -join "`n" } else { "Workflow failed before a build log was created." }
          $body = @"
          Host refactor CI failed on commit $env:GITHUB_SHA.

          ```text
          $tail
          ```
          "@
          Set-Content -Path host-refactor-report.md -Value $body -Encoding UTF8
          gh issue comment 22 --repo LaooooB/GestureRack --body-file host-refactor-report.md

      - name: Commit verified refactor to main
        shell: bash
        run: |
          rm -f tools/apply_raw_host_graph_refactor.py
          rm -f tools/apply_raw_host_compile_fixes.py
          rm -f .github/workflows/apply-raw-host-graph-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace hosted wrapper with raw bus-aware plugin graph"
          git push origin HEAD:main

      - name: Report success
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git rev-parse HEAD
          gh issue comment 22 --repo LaooooB/GestureRack --body "Host refactor CI passed. Raw hosted graph refactor was compiled with JUCE 8.0.15/MSVC Release and pushed to main as commit $head."

name: Windows VST3 Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vst3:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE
          fetch-depth: 1

      - name: Configure JUCE project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGESTURERACK_FETCH_JUCE=OFF

      - name: Build GestureRack Standalone and isolated scanner
        run: cmake --build build --config Release --target GestureRack_Standalone --parallel 2

      - name: Stage standalone
        shell: pwsh
        run: |
          $standalone = "release/GestureRack-Windows-Standalone"
          New-Item -ItemType Directory -Force $standalone | Out-Null
          Copy-Item -Force "build/GestureRack_artefacts/Release/Standalone/Gesture Rack.exe" "$standalone/Gesture Rack.exe"
          Copy-Item -Force "build/GestureRack_artefacts/Release/Standalone/GestureRackScanner.exe" "$standalone/GestureRackScanner.exe"
          if (-not (Test-Path "$standalone/Gesture Rack.exe")) { throw "Gesture Rack standalone EXE missing" }
          if (-not (Test-Path "$standalone/GestureRackScanner.exe")) { throw "GestureRackScanner missing beside standalone" }
          $appHash = (Get-FileHash "$standalone/Gesture Rack.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $scannerHash = (Get-FileHash "$standalone/GestureRackScanner.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$appHash  Gesture Rack.exe",
            "$scannerHash  GestureRackScanner.exe"
          ) | Set-Content -Encoding ASCII "$standalone/SHA256SUMS.txt"

      - name: Upload Gesture Rack Standalone
        uses: actions/upload-artifact@v4
        with:
          name: GestureRack-Windows-Standalone
          path: release/GestureRack-Windows-Standalone/
          if-no-files-found: error
          retention-days: 30

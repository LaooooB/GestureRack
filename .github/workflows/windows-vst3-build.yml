name: Windows VST3 Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-vst3:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run vision regression tests
        working-directory: VisionEngine
        run: python -m unittest -v test_slot_selector.py test_right_gesture_classifier.py test_gesture_stabilizer.py

      - name: Configure JUCE project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGESTURERACK_FETCH_JUCE=ON

      - name: Build GestureRack VST3
        run: cmake --build build --config Release --target GestureRack_VST3 --parallel 2

      # Keep the compiled plugin available as a downloadable CI artifact.
      - name: Upload Gesture Rack VST3
        uses: actions/upload-artifact@v4
        with:
          name: GestureRack-Windows-VST3
          path: build/GestureRack_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30

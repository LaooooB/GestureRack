name: Windows VST3 Fast Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-vst3-fast-package.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-vst3-fast-package.yml'
      - '.ci/fast-package-probe*'

permissions:
  contents: write

concurrency:
  group: windows-vst3-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE
          fetch-depth: 1

      - name: Configure JUCE project
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGESTURERACK_FETCH_JUCE=OFF *>&1 | Tee-Object -FilePath configure.log
          exit $LASTEXITCODE

      - name: Build GestureRack VST3 and isolated scanner
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release --target GestureRack_VST3 --parallel 2 *>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Stage VST3-only test package
        id: stage
        if: steps.configure.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $package = "release/GestureRack-Windows-VST3"
          $vst3Source = "build/GestureRack_artefacts/Release/VST3/Gesture Rack.vst3"
          $vst3Binary = "$package/Gesture Rack.vst3/Contents/x86_64-win/Gesture Rack.vst3"
          $scannerBinary = "$package/Gesture Rack.vst3/Contents/x86_64-win/GestureRackScanner.exe"
          New-Item -ItemType Directory -Force "release" | Out-Null
          Copy-Item -Recurse -Force $vst3Source "$package/Gesture Rack.vst3"
          @(
            "Gesture Rack Windows VST3 Test Package",
            "Version: 0.5.0",
            "Commit: $env:GITHUB_SHA",
            "Built: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssK')",
            "Plugin chain: dynamic/unbounded with one trailing add slot",
            "Gesture selection: FX 1-10 only; FX 11+ mouse-only",
            "Instruments: supported with MIDI-driven zero-input audio generation",
            "Hosted rack/meta effects: strict main-I/O containment",
            "Audio bridge: isolated child processing buffer for every hosted plugin",
            "Topology: audio-thread-safe fallback with message-thread async recovery",
            "DSP safety: NaN/Inf and runaway peak blocks rejected per hosted slot",
            "Sidechain/AUX: disabled by default in v0.5.0 stability mode"
          ) | Set-Content -Encoding UTF8 "$package/VERSION.txt"
          if (-not (Test-Path $vst3Binary)) { throw "Gesture Rack VST3 binary missing" }
          if (-not (Test-Path $scannerBinary)) { throw "GestureRackScanner missing from VST3 bundle" }
          $vst3Hash = (Get-FileHash $vst3Binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $scannerHash = (Get-FileHash $scannerBinary -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$vst3Hash  Gesture Rack.vst3/Contents/x86_64-win/Gesture Rack.vst3",
            "$scannerHash  Gesture Rack.vst3/Contents/x86_64-win/GestureRackScanner.exe"
          ) | Set-Content -Encoding ASCII "$package/SHA256SUMS.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "release/GestureRack-Windows-VST3.zip" -Force

      - name: Upload Actions artifact
        id: upload
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GestureRack-Windows-VST3
          path: release/GestureRack-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish package or failure logs
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "gesturerack-ci-artifacts"
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          git fetch origin ci-artifacts
          git worktree add -B ci-artifacts $publishDir origin/ci-artifacts
          Push-Location $publishDir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -Force GestureRack-Windows-VST3.zip, STATUS.txt, configure.log, build.log -ErrorAction SilentlyContinue
          @(
            "commit=$env:GITHUB_SHA",
            "configure=${{ steps.configure.outcome }}",
            "build=${{ steps.build.outcome }}",
            "stage=${{ steps.stage.outcome }}",
            "built=$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssK')"
          ) | Set-Content -Encoding ASCII "STATUS.txt"
          if (Test-Path "$env:GITHUB_WORKSPACE/configure.log") { Copy-Item "$env:GITHUB_WORKSPACE/configure.log" . }
          if (Test-Path "$env:GITHUB_WORKSPACE/build.log") { Copy-Item "$env:GITHUB_WORKSPACE/build.log" . }
          if (Test-Path "$env:GITHUB_WORKSPACE/release/GestureRack-Windows-VST3.zip") {
            Copy-Item "$env:GITHUB_WORKSPACE/release/GestureRack-Windows-VST3.zip" .
          }
          git add -A
          git commit -m "Report Windows VST3 $env:GITHUB_SHA" --allow-empty
          git push origin ci-artifacts --force
          Pop-Location

      - name: Fail job when build did not produce a package
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.configure.outcome }}" -ne "success" -or
              "${{ steps.build.outcome }}" -ne "success" -or
              "${{ steps.stage.outcome }}" -ne "success") {
            throw "Fast Windows VST3 package did not complete successfully."
          }

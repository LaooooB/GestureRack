name: Apply Rack Host Debug Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rackhost-debug-patch.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'CMakeLists.txt',
              'project(GestureRack VERSION 0.2.0 LANGUAGES C CXX)',
              'project(GestureRack VERSION 0.3.0 LANGUAGES C CXX)')

          replace_once(
              'Source/RackInteraction.cpp',
              '''    if (description.isInstrument || description.numInputChannels <= 0)\n    {\n        slot.setLastError ("This rack hosts audio effects, not instruments.");\n        return;\n    }\n\n    parameterLearnManager.cancelIfSlot (slotIndex);''',
              '''    // Scanner channel counts are discovery metadata only. Complex VST3 rack/meta\n    // effects can report zero or incomplete I/O until a real instance is created and\n    // its buses are negotiated. Only the explicit instrument policy is enforced here;\n    // configureChildForHosting() is the runtime compatibility authority.\n    if (description.isInstrument)\n    {\n        slot.setLastError ("This rack hosts audio effects, not instruments.");\n        return;\n    }\n\n    slot.setLastError ("LOADING " + description.name + "...");\n    parameterLearnManager.cancelIfSlot (slotIndex);''')

          replace_once(
              'Source/PluginEditor.cpp',
              '''    auto statusArea = topBarBounds;\n    statusArea.removeFromRight (settingsButton.getWidth() + menuButton.getWidth() + 16);\n    statusArea = statusArea.removeFromRight (150);''',
              '''    auto topRight = topBarBounds;\n    topRight.removeFromRight (settingsButton.getWidth() + menuButton.getWidth() + 16);\n\n    auto versionArea = topRight.removeFromRight (88);\n    g.setColour (ui::textMuted.withAlpha (0.82f));\n    g.setFont (ui::metaFont());\n    g.drawText ("v" + juce::String (JucePlugin_VersionString), versionArea,\n                juce::Justification::centredRight);\n\n    topRight.removeFromRight (8);\n    auto statusArea = topRight.removeFromRight (150);''')

          replace_once(
              'Source/PluginEditor.cpp',
              '''    if (const auto error = processor.getSlotLastError (processor.getSelectedSlot()); error.isNotEmpty())\n    {\n        auto errorArea = pluginPanelBounds.reduced (14).removeFromBottom (18);\n        g.setColour (ui::accentDim);\n        g.setFont (ui::metaFont());\n        g.drawFittedText (error, errorArea, juce::Justification::centredLeft, 1);\n    }''',
              '''    if (const auto error = processor.getSlotLastError (processor.getSelectedSlot()); error.isNotEmpty())\n    {\n        auto errorArea = pluginPanelBounds.reduced (28);\n        errorArea = errorArea.withSizeKeepingCentre (juce::jmin (760, errorArea.getWidth()), 54);\n        const auto loading = error.startsWithIgnoreCase ("LOADING ");\n        g.setColour (loading ? ui::control.withAlpha (0.94f) : ui::panelLow.withAlpha (0.96f));\n        g.fillRoundedRectangle (errorArea.toFloat(), 6.0f);\n        g.setColour (loading ? ui::border : ui::accentDim);\n        g.drawRoundedRectangle (errorArea.toFloat().reduced (0.5f), 6.0f, 0.9f);\n        g.setColour (loading ? ui::textMuted : ui::accent);\n        g.setFont (ui::controlFont());\n        g.drawFittedText (error, errorArea.reduced (12, 5), juce::Justification::centred, 2);\n    }''')

      - name: Commit patch to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt Source/RackInteraction.cpp Source/PluginEditor.cpp
          git commit -m "Fix rack meta-effect loading and show build version"
          git push origin HEAD:main

name: Publish Verified Face Mosaic And Presets

on:
  pull_request:
    branches:
      - main
    paths:
      - '.ci/face-mosaic-publish-probe*'

permissions:
  contents: write

concurrency:
  group: publish-face-mosaic-presets
  cancel-in-progress: false

jobs:
  publish-verified-source:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact implementation verified by Apply Face Mosaic And Presets 8
        shell: pwsh
        run: |
          python tools/apply_face_mosaic_presets.py
          if ($LASTEXITCODE -ne 0) {
            if (-not (Select-String -Quiet -Path Source/PluginEditor.h -Pattern 'FACE MOSAIC')) { exit $LASTEXITCODE }
          }
          exit 0

      - name: Normalize frozen face cascade resource
        run: python tools/fix_face_mosaic_packaging.py

      - name: Verify source invariants
        shell: pwsh
        run: |
          if (-not (Select-String -Quiet -Path CMakeLists.txt -Pattern 'COMPANY_NAME "Lao_B"')) { throw 'Lao_B signature missing' }
          if (-not (Select-String -Quiet -Path Source/PluginEditor.h -Pattern 'FACE MOSAIC')) { throw 'Face Mosaic UI missing' }
          if (-not (Select-String -Quiet -Path Source/PluginEditor.cpp -Pattern 'SAVE USER PRESET')) { throw 'Preset save missing' }
          if (-not (Select-String -Quiet -Path Source/PluginEditor.cpp -Pattern 'LOAD USER PRESET')) { throw 'Preset load missing' }
          if (-not (Select-String -Quiet -Path Source/PluginProcessor.cpp -Pattern 'faceMosaicEnabled')) { throw 'Persisted mosaic state missing' }
          if (-not (Select-String -Quiet -Path VisionEngine/vision_engine.py -Pattern 'set_face_mosaic')) { throw 'Vision mosaic command missing' }
          if (-not (Select-String -Quiet -Path VisionEngine/GestureVisionEngine.spec -Pattern 'models/haarcascade_frontalface_default.xml')) { throw 'Frozen face resource missing' }

      - name: Commit verified product source to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_face_mosaic_presets.py tools/fix_face_mosaic_packaging.py
          git add CMakeLists.txt
          git add Source/VisionReceiver.h Source/VisionReceiver.cpp Source/PluginProcessor.h Source/PluginProcessor.cpp Source/PluginEditor.h Source/PluginEditor.cpp
          git add VisionEngine/vision_engine.py VisionEngine/face_mosaic.py VisionEngine/test_face_mosaic.py VisionEngine/GestureVisionEngine.spec
          git diff --cached --check
          git status --short
          git commit -m "Add face mosaic and user preset workflow"
          git push origin HEAD:main
